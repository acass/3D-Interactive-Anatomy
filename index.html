<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Skull Anatomy</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; height: 100vh; display: grid; grid-template-columns: 1fr 340px;
        font-family: system-ui, sans-serif; background: #0e0f13; color: #e8e8ea;
      }
      model-viewer {
        width: 100%; height: 100%;
        background:
          radial-gradient(circle at 50% 40%, rgba(20,23,32,.55), rgba(14,15,19,.76)),
          url("/office-bg.png") center / cover no-repeat;
      }

      .callout {
        border: none; background: rgba(20,22,30,.85); color: #fff;
        padding: 4px 10px; border-radius: 14px; font-size: 13px; cursor: pointer;
        border: 1px solid rgba(255,255,255,.25); white-space: nowrap;
        transition: opacity .3s, transform .2s, background .2s;
      }
      .callout:hover { background: rgba(60,120,255,.9); }
      /* Hybrid visibility: dim non-active callouts while a feature is focused */
      model-viewer.focused .callout { opacity: .25; }
      model-viewer.focused .callout.active { opacity: 1; background: rgba(60,120,255,.95); transform: scale(1.08); }

      aside {
        display: flex; flex-direction: column; border-left: 1px solid #23252e; min-height: 0;
      }
      header { padding: 14px 16px; border-bottom: 1px solid #23252e; }
      header h1 { font-size: 15px; margin: 0; }
      #status { font-size: 11px; color: #8a8f9c; margin-top: 4px; }
      #transcript { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
      .line { padding: 8px 11px; border-radius: 10px; font-size: 14px; line-height: 1.4; max-width: 100%; }
      .line.you { background: #2a3550; align-self: flex-end; }
      .line.guide { background: #1a1c24; align-self: flex-start; }
      form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #23252e; }
      #chat-input { flex: 1; padding: 9px 12px; border-radius: 8px; border: 1px solid #303441; background: #14161c; color: #fff; font-size: 14px; }
      form button { padding: 9px 14px; border-radius: 8px; border: none; color: #fff; font-weight: 600; cursor: pointer; white-space: nowrap; }
      button[type="submit"] { background: #3c78ff; }
      #mic-btn { background: #2a2d38; }
      #mic-btn.live { background: #e0453c; }
    </style>
  </head>
  <body>
    <model-viewer
      id="viewer"
      camera-controls
      auto-rotate
      auto-rotate-delay="0"
      interpolation-decay="200"
      shadow-intensity="1"
      exposure="1"
    ></model-viewer>

    <aside>
      <header>
        <h1>Interactive Skull Anatomy</h1>
        <div id="status">idle</div>
      </header>
      <div id="transcript"></div>
      <form id="chat-form">
        <button type="button" id="mic-btn" title="Toggle open mic">🎤</button>
        <input id="chat-input" placeholder="Ask about a bone, or say &ldquo;give me a tour&rdquo;…" autocomplete="off" />
        <button type="submit">Ask</button>
      </form>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
